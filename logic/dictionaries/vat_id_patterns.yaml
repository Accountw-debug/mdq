# Formatmuster EU-USt-IdNr. (Prüfung ohne VIES). Präfix + Regex auf value_norm (ohne Leerzeichen/Punkte).
# Quelle: Formate laut EU-Kommission (VIES). GR verwendet Präfix EL, Nordirland XI.
version: "0.1"
country_to_prefix:
  GR: EL
  XI: XI       # Nordirland (Land GB mit XI-Nummer)
patterns:
  AT: "^ATU\\d{8}$"
  BE: "^BE[01]\\d{9}$"
  BG: "^BG\\d{9,10}$"
  CY: "^CY\\d{8}[A-Z]$"
  CZ: "^CZ\\d{8,10}$"
  DE: "^DE\\d{9}$"
  DK: "^DK\\d{8}$"
  EE: "^EE\\d{9}$"
  EL: "^EL\\d{9}$"
  ES: "^ES[A-Z0-9]\\d{7}[A-Z0-9]$"
  FI: "^FI\\d{8}$"
  FR: "^FR[A-Z0-9]{2}\\d{9}$"
  HR: "^HR\\d{11}$"
  HU: "^HU\\d{8}$"
  IE: "^IE(\\d{7}[A-Z]{1,2}|\\d[A-Z+*]\\d{5}[A-Z])$"
  IT: "^IT\\d{11}$"
  LT: "^LT(\\d{9}|\\d{12})$"
  LU: "^LU\\d{8}$"
  LV: "^LV\\d{11}$"
  MT: "^MT\\d{8}$"
  NL: "^NL\\d{9}B\\d{2}$"
  PL: "^PL\\d{10}$"
  PT: "^PT\\d{9}$"
  RO: "^RO\\d{2,10}$"
  SE: "^SE\\d{12}$"
  SI: "^SI\\d{8}$"
  SK: "^SK\\d{10}$"
  XI: "^XI(\\d{9}|\\d{12}|GD\\d{3}|HA\\d{3})$"
# Nicht-EU (nur Format, kein VIES):
non_eu_patterns:
  CH: "^CHE\\d{9}(MWST|TVA|IVA)?$"
  GB: "^GB(\\d{9}|\\d{12}|GD\\d{3}|HA\\d{3})$"
  NO: "^NO\\d{9}MVA$"
