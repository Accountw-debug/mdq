# PLZ-Formate je Land (Validität ohne PLZ-Verzeichnis)
version: "0.1"
patterns:
  DE: "^\\d{5}$"
  AT: "^\\d{4}$"
  CH: "^\\d{4}$"
  LI: "^\\d{4}$"
  NL: "^\\d{4}\\s?[A-Z]{2}$"
  BE: "^\\d{4}$"
  LU: "^L?-?\\d{4}$"
  FR: "^\\d{5}$"
  IT: "^\\d{5}$"
  ES: "^\\d{5}$"
  PT: "^\\d{4}-\\d{3}$"
  PL: "^\\d{2}-\\d{3}$"
  CZ: "^\\d{3}\\s?\\d{2}$"
  SK: "^\\d{3}\\s?\\d{2}$"
  HU: "^\\d{4}$"
  DK: "^\\d{4}$"
  SE: "^\\d{3}\\s?\\d{2}$"
  NO: "^\\d{4}$"
  FI: "^\\d{5}$"
  IE: "^[A-Z]\\d{2}\\s?[A-Z0-9]{4}$"
  GB: "^[A-Z]{1,2}\\d[A-Z\\d]?\\s?\\d[A-Z]{2}$"
  US: "^\\d{5}(-\\d{4})?$"
  CA: "^[A-Z]\\d[A-Z]\\s?\\d[A-Z]\\d$"
  RO: "^\\d{6}$"
  BG: "^\\d{4}$"
  HR: "^\\d{5}$"
  SI: "^\\d{4}$"
  GR: "^\\d{3}\\s?\\d{2}$"
  TR: "^\\d{5}$"
  CN: "^\\d{6}$"
  JP: "^\\d{3}-?\\d{4}$"
  IN: "^\\d{6}$"
  AU: "^\\d{4}$"
